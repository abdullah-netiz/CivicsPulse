[project]
name = "civicpulse-backend"
version = "0.1.0"
description = "CivicPulse complaint triage API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.37",
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "redis==5.2.1",
  "prometheus-client==0.21.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "aiosqlite==0.20.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
