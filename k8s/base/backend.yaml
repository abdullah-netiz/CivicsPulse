apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: backend
          image: civicpulse-backend:PLACEHOLDER
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: civicpulse-config
            - secretRef:
                name: civicpulse-secrets
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            # 30 x 2s = 60s was too tight: the first boot runs
            # `alembic upgrade head` before uvicorn listens, and on a cold
            # database the kubelet SIGKILLed the container mid-migration
            # (exit 137), which turned the rollout into a crash-loop.
            # 30 x 5s = 150s gives a cold start room without weakening the
            # liveness probe, which still restarts a wedged process.
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
