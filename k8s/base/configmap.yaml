apiVersion: v1
kind: ConfigMap
metadata:
  name: civicpulse-config
data:
  APP_NAME: CivicPulse
  ENVIRONMENT: production
  TRIAGE_PROVIDER: simulated
  GROQ_MODEL: llama-3.1-8b-instant
