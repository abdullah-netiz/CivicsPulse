name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/abdullah-netiz
  # Defined once and reused everywhere: helm/kind-action defaults the cluster to
  # "chart-testing" while the kind CLI defaults to "kind", so the two must be
  # pinned to the same name or `kind load docker-image` addresses a cluster that
  # does not exist ("ERROR: no nodes found for cluster \"kind\"").
  CLUSTER_NAME: civicpulse

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
          artifact-name: backend-sbom.spdx.json
          output-file: backend-sbom.spdx.json
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
          artifact-name: frontend-sbom.spdx.json
          output-file: frontend-sbom.spdx.json

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # build-push pushes to GHCR from a different runner, so this job starts
      # with no registry session. Without the login the `docker pull` below would
      # fail for private packages (packages pushed by a workflow default to
      # private), and the whole image side-loading would break.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create ephemeral cluster
        uses: helm/kind-action@v1.10.0
        with:
          # Pin the name; the action's default is "chart-testing".
          cluster_name: ${{ env.CLUSTER_NAME }}
      - name: Install cluster prerequisites
        run: |
          # kind ships no dynamic storage provisioner, so the Postgres and Redis
          # PVCs would stay Pending forever, their pods would never become Ready
          # and both rollouts would burn their full timeout.
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.37/deploy/local-path-storage.yaml
          kubectl wait --for=condition=Available deployment/local-path-provisioner \
            -n local-path-storage --timeout=120s
          kubectl patch storageclass local-path \
            -p '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
          # k8s/base/vpa.yaml is part of the prod overlay, so the
          # VerticalPodAutoscaler CRDs must exist before `kubectl apply -k`
          # (CRDs only: updateMode is "Off", so no controller is required).
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.3.1/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml
      - name: Configure immutable images
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            civicpulse-backend=${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }} \
            civicpulse-frontend=${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
          docker pull ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
          docker pull ${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
          # --name is required: without it the kind CLI looks for a cluster
          # called "kind". The tags match the overlay exactly because
          # `kustomize edit set image` above wrote the same SHA into
          # ghcr.io/abdullah-netiz/civicpulse-{backend,frontend}.
          kind load docker-image --name "${CLUSTER_NAME}" \
            ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
          kind load docker-image --name "${CLUSTER_NAME}" \
            ${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod
      # The secrets are passed through `env:` instead of being interpolated into
      # the command line: a quote or backtick in a password can no longer break
      # the shell. Secret name/namespace match the `secretRef` and
      # `secretKeyRef` entries in k8s/base/{backend,postgres}.yaml.
      - name: Apply runtime secrets
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Fail in seconds, not after a five-minute rollout timeout: an empty
          # POSTGRES_PASSWORD makes the postgres container refuse to initialise.
          : "${POSTGRES_PASSWORD:?the POSTGRES_PASSWORD repository secret is not set}"
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::warning::GROQ_API_KEY is empty; TRIAGE_PROVIDER=llm will fall back to rules."
          fi
          kubectl create secret generic civicpulse-secrets -n civicpulse \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --from-literal=DATABASE_URL="postgresql+asyncpg://civicpulse:${POSTGRES_PASSWORD}@postgres:5432/civicpulse" \
            --from-literal=GROQ_API_KEY="$GROQ_API_KEY" \
            --from-literal=GEMINI_API_KEY="$GEMINI_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart statefulset/postgres -n civicpulse
          # Postgres must be Ready before anything that talks to it starts.
          kubectl rollout status statefulset/postgres -n civicpulse --timeout=300s
      # Every backend replica runs `alembic upgrade head` on boot. On a fresh
      # database the replicas race for the same DDL locks, and a pod that waits
      # longer than its startup probe is SIGKILLed (exit 137) straight into
      # CrashLoopBackOff backoff, which makes the rollout below time out.
      # Migrating once, to completion, turns each pod's boot into a fast no-op.
      - name: Migrate the database once
        run: |
          kubectl delete job civicpulse-migrate -n civicpulse --ignore-not-found
          kubectl apply -f - <<'YAML'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: civicpulse-migrate
            namespace: civicpulse
          spec:
            backoffLimit: 3
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: migrate
                    image: ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
                    imagePullPolicy: IfNotPresent
                    command: ["alembic", "upgrade", "head"]
                    envFrom:
                      - configMapRef:
                          name: civicpulse-config
                      - secretRef:
                          name: civicpulse-secrets
          YAML
          kubectl wait --for=condition=complete job/civicpulse-migrate -n civicpulse --timeout=300s || {
            echo "::error::the database migration Job did not complete"
            kubectl get pods -n civicpulse -l job-name=civicpulse-migrate -o wide || true
            kubectl logs -n civicpulse -l job-name=civicpulse-migrate --tail=50 || true
            exit 1
          }
      # The pods created by "Apply manifests" still carry the placeholder
      # secret, so the backend is rolled out again now that the runtime secret
      # exists and the schema is migrated.
      - name: Restart the backend
        run: kubectl rollout restart deployment/backend -n civicpulse
      - name: Wait for rollout
        run: |
          # 300s covers the cold path: the node pulls postgres:16.6-alpine and
          # redis:7.4-alpine, Postgres then runs initdb, and the backend only
          # becomes Ready once /ready reports both Postgres and Redis as ok.
          # A failed wait dumps the cluster state so the failure is diagnosable
          # from the job log alone.
          rollout() {
            if kubectl rollout status "$1" -n civicpulse --timeout=300s; then
              return 0
            fi
            echo "::error::$1 did not finish rolling out within 300s"
            kubectl get pods -n civicpulse -o wide || true
            kubectl get events -n civicpulse --sort-by=.lastTimestamp | tail -30 || true
            kubectl logs -n civicpulse -l app=backend --all-containers --prefix --tail=60 || true
            kubectl logs -n civicpulse -l app=frontend --all-containers --prefix --tail=30 || true
            kubectl describe deployment/backend -n civicpulse || true
            return 1
          }
          rollout statefulset/postgres
          rollout deployment/backend
          rollout deployment/frontend
      - name: Smoke test the service
        run: |
          kubectl port-forward -n civicpulse service/frontend 8080:80 >/tmp/port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/api/stats && exit 0
            sleep 2
          done
          kubectl get pods -n civicpulse
          kubectl describe deployment/backend -n civicpulse
          exit 1
      # Diagnostic only: the VPA CRDs are installed above, but this step must
      # never be able to fail the deployment, so it is non-blocking.
      - name: Print autoscaling status
        if: always()
        run: kubectl get hpa,vpa,pdb -n civicpulse || true
