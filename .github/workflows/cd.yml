name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/abdullah-netiz

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
      - name: Generate backend SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
          artifact-name: backend-sbom.spdx.json
          output-file: backend-sbom.spdx.json
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
          artifact-name: frontend-sbom.spdx.json
          output-file: frontend-sbom.spdx.json

  deploy-k8s:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral cluster
        uses: helm/kind-action@v1.10.0
      - name: Configure immutable images
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            civicpulse-backend=${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }} \
            civicpulse-frontend=${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
          docker pull ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
          docker pull ${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/civicpulse-backend:${{ github.sha }}
          kind load docker-image ${{ env.IMAGE_PREFIX }}/civicpulse-frontend:${{ github.sha }}
      - name: Apply manifests
        run: kubectl apply -k k8s/overlays/prod
      - name: Apply runtime secrets
        run: |
          kubectl create secret generic civicpulse-secrets -n civicpulse \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=DATABASE_URL="postgresql+asyncpg://civicpulse:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/civicpulse" \
            --from-literal=GROQ_API_KEY='${{ secrets.GROQ_API_KEY }}' \
            --from-literal=GEMINI_API_KEY='${{ secrets.GEMINI_API_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart statefulset/postgres -n civicpulse
          kubectl rollout restart deployment/backend -n civicpulse
      - name: Wait for rollout
        run: |
          kubectl rollout status statefulset/postgres -n civicpulse --timeout=180s
          kubectl rollout status deployment/backend -n civicpulse --timeout=180s
          kubectl rollout status deployment/frontend -n civicpulse --timeout=180s
      - name: Smoke test the service
        run: |
          kubectl port-forward -n civicpulse service/frontend 8080:80 >/tmp/port-forward.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/api/stats && exit 0
            sleep 2
          done
          kubectl get pods -n civicpulse
          kubectl describe deployment/backend -n civicpulse
          exit 1
      - name: Print autoscaling status
        if: always()
        run: kubectl get hpa,vpa,pdb -n civicpulse
