name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned images
        run: |
          docker build --tag ghcr.io/abdullah-netiz/civicpulse-backend:${GITHUB_REF_NAME} backend
          docker build --tag ghcr.io/abdullah-netiz/civicpulse-frontend:${GITHUB_REF_NAME} frontend
          docker push ghcr.io/abdullah-netiz/civicpulse-backend:${GITHUB_REF_NAME}
          docker push ghcr.io/abdullah-netiz/civicpulse-frontend:${GITHUB_REF_NAME}
      - name: Create release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
