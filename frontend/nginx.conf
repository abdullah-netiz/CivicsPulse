server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Proxy the API surface to the backend. The frontend never needs an
  # absolute backend URL, so one built image runs in any environment (ADR 0002).
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
  }

  # Operational endpoints surfaced through the same origin so operators (and
  # the demo) can hit /health, /ready and /metrics on the frontend port.
  # /health is liveness; /ready checks Postgres + Redis and 503s when either is
  # down; /metrics is the Prometheus text endpoint.
  location = /health { proxy_pass http://backend:8000/health; }
  location = /ready { proxy_pass http://backend:8000/ready; }
  location = /metrics { proxy_pass http://backend:8000/metrics; }

  # SPA fallback: unknown paths serve index.html so client-side routing works.
  location / { try_files $uri $uri/ /index.html; }
}